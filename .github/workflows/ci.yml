name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: finbox, POSTGRES_PASSWORD: finbox, POSTGRES_DB: finbox_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finbox" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -p 1 ./...   # -p 1: packages share one test DB and truncate it
        env:
          TEST_DB_URL: postgres://finbox:finbox@localhost:5432/finbox_test
      - run: GOARCH=arm64 go build ./...   # deploy milestone: Pi 5 is arm64
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }

  # Gitleaks matters from the day this repo flips public — it's a no-op cost until then.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
