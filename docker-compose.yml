services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16   # exact tag, arm64 manifest confirmed
    environment:
      POSTGRES_USER: finbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finbox}   # override in .env on the Pi
      POSTGRES_DB: finbox
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  finbox:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FINBOX_DB_URL: postgres://finbox:${POSTGRES_PASSWORD:-finbox}@postgres:5432/finbox
      FINBOX_BLOB_DIR: /data/receipts
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FINBOX_OPENAI_MODEL: ${FINBOX_OPENAI_MODEL:-gpt-4o-mini}
      TZ: America/Mexico_City
    volumes:
      - receipts:/data/receipts
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  pgdata:
  receipts:
